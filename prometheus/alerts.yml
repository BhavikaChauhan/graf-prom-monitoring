groups:
  # ── Infra alerts ─────────────────────────────────────────────
  - name: infrastructure
    rules:
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value | humanize }}% — above 80% for 2 minutes."

      - alert: CriticalCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 95
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL CPU on {{ $labels.instance }}"
          description: "CPU at {{ $value | humanize }}% — server may be unresponsive."

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is {{ $value | humanize }}%."

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Only {{ $value | humanize }}% disk space remaining."

  # ── App alerts ───────────────────────────────────────────────
  - name: application
    rules:
      - alert: AppDown
        expr: up{job="nodeapp"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "🔴 App is DOWN"
          description: "The Node.js app has been unreachable for 1 minute."

      - alert: HighErrorRate
        expr: |
          rate(nodeapp_http_requests_total{status_code=~"5.."}[5m])
          /
          rate(nodeapp_http_requests_total[5m]) * 100 > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanize }}% — above 5% threshold."

      - alert: SlowResponseTime
        expr: |
          histogram_quantile(0.95,
            rate(nodeapp_http_request_duration_seconds_bucket[5m])
          ) > 1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Slow p95 response time"
          description: "p95 latency is {{ $value | humanizeDuration }} — above 1s."

      - alert: SLOErrorBudgetBurning
        expr: |
          rate(nodeapp_http_requests_total{status_code=~"5.."}[1h])
          /
          rate(nodeapp_http_requests_total[1h]) * 100 > 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "SLO error budget burning fast"
          description: "Error rate {{ $value | humanize }}% over 1h — SLO at risk."
